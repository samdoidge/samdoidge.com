<header class="header">
  <a class="logo" href="/">
    <img
      class="logo__img"
      src="/assets/img/logo.png"
      alt="{{ site.author }} logo"
      width="84"
      height="84" />
  </a>

  <div class="header__text">
    {% if page.url == "/" %}
    <h1 class="header__title">
      <a class="header__link" href="/">{{ site.author }}</a>
    </h1>
    {% else %}
    <p class="header__title">
      <a class="header__link" href="/">{{ site.author }}</a>
    </p>
    {% endif %}
    <p class="header__description">{{ site.title }}</p>
  </div>
</header>
